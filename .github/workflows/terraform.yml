# One repository, one pipeline, one state per stack.
#
# Every stack runs with the credentials that configure-aws-credentials provides.
# The consumer stack spans two accounts and needs a profile per provider, so the
# pipeline cannot apply it yet. See docs/concept.md.
#
# Order: the platform stack publishes the event bus and the permissions
# boundary. The product stacks resolve both by name, so they run after it.

name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  platform:
    name: platform
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Check formatting
        run: terraform fmt -check -recursive terraform/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        working-directory: terraform/stacks/platform
        run: terraform init

      - name: Validate
        working-directory: terraform/stacks/platform
        run: terraform validate

      - name: Plan
        working-directory: terraform/stacks/platform
        run: terraform plan -out=tfplan

      - name: Apply
        if: github.ref == 'refs/heads/main'
        working-directory: terraform/stacks/platform
        run: terraform apply -auto-approve tfplan

  product-stacks:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: consumers/fulfillment-service
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Init
        working-directory: terraform/stacks/${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: terraform/stacks/${{ matrix.stack }}
        run: terraform validate
